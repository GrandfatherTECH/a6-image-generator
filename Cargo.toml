[package]
name = "a6-image-studio"
version = "0.1.0"
edition = "2024"
description = "A Linux client for image generation through A6API"
build = "build.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = { version = "0.16", default-features = false, features = ["tokio", "wayland", "xdg-portal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "=1.17.1", default-features = false, features = ["accessibility", "backend-winit", "compat-1-2", "renderer-femtovg", "renderer-software", "std"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"

[build-dependencies]
slint-build = "=1.17.1"
